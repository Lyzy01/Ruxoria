<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create UGC - Rokori</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="bg-[#111216] text-white min-h-screen">
  <header id="rokori-navbar"></header>
  <aside id="rokori-sidebar"></aside>

  <main class="pt-20 pb-20 px-4 sm:px-8 lg:ml-56 max-w-[1200px]">
    <div class="mb-6">
      <h1 class="text-2xl sm:text-3xl font-black">🛠️ UGC Creator Studio</h1>
      <p class="text-sm text-[#BDBEBE]">Publish new UGC items to the Marketplace and earn 70% Ruxbux royalties on every sale.</p>
    </div>

    <form id="ugc-form" class="bg-[#232527] border border-[#2B2D31] rounded-2xl p-6 max-w-lg space-y-4">
      <div>
        <label class="block text-xs font-bold text-[#BDBEBE] uppercase mb-1">Item Name</label>
        <input id="u-name" type="text" required placeholder="e.g. Emerald Valkyrie" class="w-full bg-[#111216] border border-[#2B2D31] rounded-xl px-3.5 py-2.5 text-sm text-white outline-none" />
      </div>
      <div>
        <label class="block text-xs font-bold text-[#BDBEBE] uppercase mb-1">Description</label>
        <input id="u-desc" type="text" placeholder="Item lore or details..." class="w-full bg-[#111216] border border-[#2B2D31] rounded-xl px-3.5 py-2.5 text-sm text-white outline-none" />
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold text-[#BDBEBE] uppercase mb-1">Category</label>
          <select id="u-cat" class="w-full bg-[#111216] border border-[#2B2D31] rounded-xl px-3 py-2.5 text-sm text-white">
            <option value="Hats">Hats</option>
            <option value="Faces">Faces</option>
            <option value="Accessories">Accessories</option>
            <option value="Gears">Gears</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-[#BDBEBE] uppercase mb-1">Icon Emoji</label>
          <input id="u-icon" type="text" value="👑" class="w-full bg-[#111216] border border-[#2B2D31] rounded-xl px-3.5 py-2.5 text-sm text-white text-center" />
        </div>
      </div>
      <div>
        <label class="block text-xs font-bold text-[#BDBEBE] uppercase mb-1">Sale Price (Ruxbux)</label>
        <input id="u-price" type="number" min="0" value="250" class="w-full bg-[#111216] border border-[#2B2D31] rounded-xl px-3.5 py-2.5 text-sm text-white outline-none" />
      </div>
      <label class="flex items-center gap-2 text-xs font-bold text-amber-400 cursor-pointer">
        <input id="u-limited" type="checkbox" class="rounded" /> Mark as Limited Collectible
      </label>
      <button type="submit" class="w-full bg-[#00B06F] hover:bg-[#009960] text-white font-black py-3 rounded-xl shadow-lg">
        Publish UGC Item
      </button>
    </form>
  </main>

  <script src="/js/api.js"></script>
  <script>
    document.getElementById('ugc-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!Rokori.user) return Rokori.openAuthModal('login');
      try {
        const res = await Rokori.api('/api/catalog/create', {
          method: 'POST',
          body: JSON.stringify({
            name: document.getElementById('u-name').value.trim(),
            description: document.getElementById('u-desc').value.trim(),
            category: document.getElementById('u-cat').value,
            icon: document.getElementById('u-icon').value.trim() || '🎩',
            price: Number(document.getElementById('u-price').value) || 0,
            is_limited: document.getElementById('u-limited').checked
          })
        });
        Rokori.toast(res.message);
        setTimeout(() => window.location.href = '/index.html', 800);
      } catch (err) { Rokori.toast(err.message, 'error'); }
    });

    (async () => await Rokori.initShell('create'))();
  </script>
</body>
</html>
