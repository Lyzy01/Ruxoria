<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventory & Sell - Rokori</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="bg-[#111216] text-white min-h-screen">
  <header id="rokori-navbar"></header>
  <aside id="rokori-sidebar"></aside>

  <main class="pt-20 pb-20 px-4 sm:px-8 lg:ml-56 max-w-[1600px]">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
      <div>
        <h1 class="text-2xl sm:text-3xl font-black">🎒 My Inventory & Resale</h1>
        <p class="text-sm text-[#BDBEBE]">List your UGC items on the P2P Marketplace for Ruxbux.</p>
      </div>
      <div class="bg-[#232527] border border-[#2B2D31] px-4 py-2.5 rounded-xl">
        <div class="text-[11px] text-[#BDBEBE] uppercase font-bold">Total Inventory RAP</div>
        <div id="total-rap-display" class="text-lg font-black text-amber-400">0 Ruxbux</div>
      </div>
    </div>

    <div id="inventory-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 xl:grid-cols-5 gap-4"></div>
  </main>

  <script src="/js/api.js"></script>
  <script>
    async function loadInventory() {
      if (!Rokori.user) return Rokori.openAuthModal('login');
      const res = await Rokori.api('/api/catalog/inventory/me');
      document.getElementById('total-rap-display').textContent = `${(res.totalRap || 0).toLocaleString()} Ruxbux`;

      const grid = document.getElementById('inventory-grid');
      if (!res.items || res.items.length === 0) {
        grid.innerHTML = '<div class="col-span-full text-center text-sm text-[#BDBEBE] py-12">Your inventory is empty. Visit the Marketplace!</div>';
        return;
      }

      grid.innerHTML = res.items.map(item => `
        <div class="bg-[#232527] border border-[#2B2D31] rounded-2xl p-4 flex flex-col justify-between">
          <div>
            <div class="aspect-square bg-[#111216] rounded-xl flex items-center justify-center text-5xl mb-3">${item.icon || '🎩'}</div>
            <div class="text-sm font-bold truncate">${Rokori.escapeHtml(item.name)}</div>
            <div class="text-xs text-amber-400 font-bold mt-0.5">RAP: ${(item.rap || item.price).toLocaleString()} R</div>
          </div>
          <div class="mt-3 pt-2.5 border-t border-white/5 space-y-2">
            ${item.resale_price ? `
              <div class="text-xs text-[#00B06F] font-bold">Listed: ${item.resale_price.toLocaleString()} R</div>
              <button onclick="setResale(${item.inventory_id}, 0)" class="w-full bg-red-600/80 hover:bg-red-600 text-xs font-bold py-1.5 rounded-lg">Unlist Item</button>
            ` : `
              <div class="flex gap-1.5">
                <input id="sell-price-${item.inventory_id}" type="number" min="1" placeholder="Price" class="w-full bg-[#111216] border border-[#2B2D31] rounded-lg px-2 py-1 text-xs text-white" />
                <button onclick="listForSale(${item.inventory_id})" class="bg-[#00B06F] text-xs font-bold px-3 py-1 rounded-lg">Sell</button>
              </div>
            `}
          </div>
        </div>
      `).join('');
    }

    async function listForSale(invId) {
      const val = document.getElementById(`sell-price-${invId}`).value;
      if (!val || Number(val) <= 0) return Rokori.toast('Enter a valid Ruxbux price.', 'error');
      await setResale(invId, Number(val));
    }

    async function setResale(invId, price) {
      try {
        const res = await Rokori.api(`/api/catalog/inventory/${invId}/sell`, {
          method: 'POST',
          body: JSON.stringify({ price })
        });
        Rokori.toast(res.message);
        loadInventory();
      } catch (err) { Rokori.toast(err.message, 'error'); }
    }

    (async () => {
      await Rokori.initShell('inventory');
      await loadInventory();
    })();
  </script>
</body>
</html>
