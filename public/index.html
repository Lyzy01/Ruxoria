<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UGC Marketplace - Rokori</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="bg-[#111216] text-white min-h-screen">
  <header id="rokori-navbar"></header>
  <aside id="rokori-sidebar"></aside>

  <main class="pt-20 pb-20 px-4 sm:px-8 lg:ml-56 max-w-[1600px]">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
      <div>
        <h1 class="text-2xl sm:text-3xl font-black">🛍️ UGC Marketplace</h1>
        <p class="text-sm text-[#BDBEBE]">Buy official items, community UGCs, and limited player resales.</p>
      </div>
      <div class="flex gap-2">
        <a href="/trade.html" class="bg-[#232527] hover:bg-[#2B2D31] border border-[#2B2D31] px-4 py-2 rounded-xl text-sm font-bold">🤝 Trade Hub</a>
        <a href="/create.html" class="bg-[#00B06F] hover:bg-[#009960] px-4 py-2 rounded-xl text-sm font-bold">+ Create UGC</a>
      </div>
    </div>

    <!-- Filters & Search -->
    <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
      <div class="flex gap-2 overflow-x-auto pb-1">
        <button data-cat="All" class="cat-pill px-4 py-1.5 rounded-full text-xs font-bold bg-white text-black">All</button>
        <button data-cat="Limiteds" class="cat-pill px-4 py-1.5 rounded-full text-xs font-bold bg-[#232527] text-amber-400">Limiteds ✨</button>
        <button data-cat="Hats" class="cat-pill px-4 py-1.5 rounded-full text-xs font-bold bg-[#232527] text-[#BDBEBE]">Hats</button>
        <button data-cat="Faces" class="cat-pill px-4 py-1.5 rounded-full text-xs font-bold bg-[#232527] text-[#BDBEBE]">Faces</button>
        <button data-cat="Accessories" class="cat-pill px-4 py-1.5 rounded-full text-xs font-bold bg-[#232527] text-[#BDBEBE]">Accessories</button>
        <button data-cat="Gears" class="cat-pill px-4 py-1.5 rounded-full text-xs font-bold bg-[#232527] text-[#BDBEBE]">Gears</button>
      </div>
      <input id="market-search" type="text" placeholder="Search items..." class="bg-[#191B1D] border border-[#2B2D31] rounded-xl px-4 py-2 text-sm text-white outline-none w-full sm:w-64" />
    </div>

    <div id="catalog-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 xl:grid-cols-5 gap-4"></div>
  </main>

  <script src="/js/api.js"></script>
  <script>
    let currentCat = 'All';

    async function loadCatalog() {
      const q = new URLSearchParams();
      if (currentCat === 'Limiteds') q.set('limitedOnly', '1');
      else if (currentCat !== 'All') q.set('category', currentCat);

      const searchVal = document.getElementById('market-search').value.trim();
      if (searchVal) q.set('search', searchVal);

      const res = await Rokori.api(`/api/catalog?${q.toString()}`);
      const grid = document.getElementById('catalog-grid');

      grid.innerHTML = (res.items || []).map(item => `
        <div class="bg-[#232527] border border-[#2B2D31] hover:border-white/20 rounded-2xl p-4 flex flex-col justify-between transition">
          <div>
            <div class="relative aspect-square bg-[#111216] rounded-xl flex items-center justify-center text-5xl mb-3">
              ${item.icon || '🎩'}
              ${item.is_limited ? `<span class="absolute top-2 left-2 bg-amber-500 text-black text-[10px] font-black px-2 py-0.5 rounded uppercase">Limited</span>` : ''}
            </div>
            <div class="text-sm font-bold truncate">${Rokori.escapeHtml(item.name)}</div>
            <div class="text-[11px] text-[#BDBEBE] truncate mb-2">By ${Rokori.escapeHtml(item.creator_name)}</div>
            <div class="text-[11px] text-amber-400 font-bold mb-2">RAP: ${(item.rap || item.price).toLocaleString()} R</div>
          </div>

          <div class="pt-2.5 border-t border-white/5 space-y-1.5">
            <div class="flex items-center justify-between">
              <span class="text-xs font-black text-[#00B06F]">${item.price === 0 ? 'FREE' : `${item.price.toLocaleString()} R`}</span>
              <button onclick="buyPrimary(${item.id})" class="bg-[#00B06F] hover:bg-[#009960] text-white text-xs font-bold px-3 py-1 rounded-lg">Buy</button>
            </div>
            ${item.lowest_resale ? `
              <button onclick="buyResale(${item.lowest_resale.inventory_id})" class="w-full bg-amber-500/20 hover:bg-amber-500/30 border border-amber-500/40 text-amber-300 text-[11px] font-bold py-1.5 rounded-lg">
                Resale: ${item.lowest_resale.resale_price.toLocaleString()} R (${Rokori.escapeHtml(item.lowest_resale.seller_name)})
              </button>
            ` : ''}
          </div>
        </div>
      `).join('');
    }

    async function buyPrimary(itemId) {
      if (!Rokori.user) return Rokori.openAuthModal('login');
      try {
        const res = await Rokori.api(`/api/catalog/${itemId}/buy`, { method: 'POST' });
        Rokori.user.korbux = res.korbux;
        Rokori.setSession(Rokori.token, Rokori.user);
        document.getElementById('nav-korbux-count').textContent = res.korbux.toLocaleString();
        Rokori.toast(res.message);
      } catch (err) { Rokori.toast(err.message, 'error'); }
    }

    async function buyResale(invId) {
      if (!Rokori.user) return Rokori.openAuthModal('login');
      try {
        const res = await Rokori.api(`/api/catalog/resale/${invId}/buy`, { method: 'POST' });
        Rokori.user.korbux = res.korbux;
        Rokori.setSession(Rokori.token, Rokori.user);
        document.getElementById('nav-korbux-count').textContent = res.korbux.toLocaleString();
        Rokori.toast(res.message);
        loadCatalog();
      } catch (err) { Rokori.toast(err.message, 'error'); }
    }

    document.querySelectorAll('.cat-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        currentCat = btn.getAttribute('data-cat');
        document.querySelectorAll('.cat-pill').forEach(b => b.className = 'cat-pill px-4 py-1.5 rounded-full text-xs font-bold bg-[#232527] text-[#BDBEBE]');
        btn.className = 'cat-pill px-4 py-1.5 rounded-full text-xs font-bold bg-white text-black';
        loadCatalog();
      });
    });

    document.getElementById('market-search').addEventListener('input', () => loadCatalog());

    (async () => {
      await Rokori.initShell('marketplace');
      await loadCatalog();
    })();
  </script>
</body>
</html>
